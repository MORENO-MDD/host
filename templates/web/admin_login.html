<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>13X1 HOST | Admin Access</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>:root{--bg:#05070c;--card:#0e1420;--line:rgba(140,170,220,.16);--blue:#568cff;--purple:#805eff;--text:#f5f7ff;--muted:#8d9ab1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;background:radial-gradient(circle at 20% 0,rgba(86,140,255,.2),transparent 33%),radial-gradient(circle at 100% 100%,rgba(128,94,255,.15),transparent 32%),var(--bg)}.card{width:min(430px,100%);padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(14,20,32,.9);box-shadow:0 30px 100px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.04)}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 12px 28px rgba(86,140,255,.25)}.eyebrow{margin-top:42px;color:#7faaff;font:11px 'JetBrains Mono';letter-spacing:1.3px;text-transform:uppercase}.card h1{font-size:28px;margin:10px 0 8px}.card p{font-size:12px;color:var(--muted);line-height:1.7}.field{margin-top:18px}.field label{display:block;color:#aab8d0;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#080d16;color:#fff;outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(86,140,255,.12)}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));font-weight:800;cursor:pointer}.back{display:inline-block;margin-top:18px;color:#86adff;text-decoration:none;font-size:11px}</style></head><body><main class="card"><div class="brand"><div class="logo"><i class="fas fa-shield-halved"></i></div><div>13X1 HOST<small style="display:block;color:var(--muted);font:9px 'JetBrains Mono';letter-spacing:1.4px;margin-top:4px">ADMIN CONTROL CENTER</small></div></div><div class="eyebrow">Restricted access</div><h1>Admin sign in</h1><p>Manage users, plans, access status and server quotas from one protected control center.</p><form method="post"><div class="field"><label>Email or username</label><input name="username" required autocomplete="username"></div><div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><button type="submit"><i class="fas fa-arrow-right-to-bracket"></i> Enter control center</button></form><a class="back" href="/"><i class="fas fa-arrow-left"></i> Back to home</a></main></body></html>
